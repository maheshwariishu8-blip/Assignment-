<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eshu's CodeLab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; color: #3e2723; background: #faf6f2; }

  /* Navbar: logo left, links + button right */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background: #4e342e;
    color: white;
  }
  nav ul { display: flex; gap: 20px; list-style: none; }
  nav a { color: white; text-decoration: none; }
  nav a:hover { color: #f4c27a; }

  .btn {
    background: #f4c27a;
    color: #3e2723;
    border: 0;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: #e6a954; }

  /* Hero: everything in the centre */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 280px;
    padding: 24px;
    text-align: center;
    background: #795548;
    color: white;
  }

  /* Cards: wrap when there is no space */
  .cards { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px; }
  .card {
    flex: 1 1 200px;   /* grow, shrink, start at 200px */
    background: #efe3da;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border-bottom: 4px solid #795548;
  }
  .card h3 { margin-bottom: 8px; color: #4e342e; }

  footer {
    text-align: center;
    padding: 16px;
    background: #4e342e;
    color: #efe3da;
    font-size: 14px;
  }
</style>
</head>
<body>
  <nav>
    <h2>Eshu's CodeLab</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button class="btn">Sign up</button>
  </nav>

  <section class="hero">
    <h1>Learn Web Development</h1>
    <p>Start from zero. Build real projects.</p>
    <button class="btn">Get started</button>
  </section>

  <section class="cards">
    <div class="card"><h3>HTML</h3><p>Build the structure</p></div>
    <div class="card"><h3>CSS</h3><p>Make it beautiful</p></div>
    <div class="card"><h3>JavaScript</h3><p>Make it smart</p></div>
    <div class="card"><h3>Git</h3><p>Save your work</p></div>
  </section>

  <footer>Made by Eshu Maheshwari</footer>
</body>
</html>
